openapi: 3.0.3
info:
  title: NetworkTracker Forecast Service
  description: >
    FastAPI-based time-series forecasting service. Receives historical network
    traffic data and returns future predictions. v1 uses a placeholder model
    (simple moving average); designed for zero-change model swap to
    Transformer-based models in v2.
  version: 1.0.0

servers:
  - url: http://localhost:8101
    description: Local development server

security:
  - bearerAuth: []

paths:
  /predict:
    post:
      summary: Generate traffic forecast
      description: >
        Accepts historical traffic data parameters and returns predicted
        future values with confidence intervals.
      operationId: generateForecast
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForecastRequest'
      responses:
        '200':
          description: Forecast generated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForecastResponse'
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: Model inference failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /models:
    get:
      summary: List available models
      description: Returns the list of available forecasting models and which is active.
      operationId: listModels
      responses:
        '200':
          description: Model list returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /health:
    get:
      summary: Health check
      description: Returns service health including model readiness.
      operationId: healthCheck
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Service-to-service JWT obtained via OAuth2 client-credentials flow
        against Keycloak.

  responses:
    Unauthorized:
      description: Missing or invalid service-to-service JWT
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ForecastRequest:
      type: object
      required: [metric, time_range]
      properties:
        metric:
          type: string
          enum: [bandwidth, packets, latency, connections]
          description: The network metric to forecast
        time_range:
          type: object
          required: [start, end]
          properties:
            start:
              type: string
              format: date-time
              description: Start of the historical data window
            end:
              type: string
              format: date-time
              description: End of the prediction window
        granularity:
          type: string
          enum: [1m, 5m, 15m, 1h, 1d]
          default: 5m
          description: Prediction interval granularity
        historical_data:
          type: array
          items:
            $ref: '#/components/schemas/DataPoint'
          description: >
            Optional inline historical data. If omitted, the service fetches
            from TimescaleDB directly.

    ForecastResponse:
      type: object
      required: [predictions, metadata]
      properties:
        predictions:
          type: array
          items:
            $ref: '#/components/schemas/PredictionPoint'
        metadata:
          type: object
          required: [model_version, metric, generated_at]
          properties:
            model_version:
              type: string
              description: Version identifier of the model used
              example: "sma-v1"
            metric:
              type: string
            confidence_interval:
              type: number
              format: float
              description: Overall confidence level (0-1)
            generated_at:
              type: string
              format: date-time
            processing_time_ms:
              type: integer

    DataPoint:
      type: object
      required: [timestamp, value]
      properties:
        timestamp:
          type: string
          format: date-time
        value:
          type: number
          format: float

    PredictionPoint:
      type: object
      required: [timestamp, value]
      properties:
        timestamp:
          type: string
          format: date-time
        value:
          type: number
          format: float
          description: Predicted value
        lower_bound:
          type: number
          format: float
          description: Lower bound of the confidence interval
        upper_bound:
          type: number
          format: float
          description: Upper bound of the confidence interval

    ModelsResponse:
      type: object
      required: [models, active_model]
      properties:
        models:
          type: array
          items:
            type: object
            required: [id, name, version, status]
            properties:
              id:
                type: string
              name:
                type: string
              version:
                type: string
              status:
                type: string
                enum: [active, available, deprecated]
              description:
                type: string
        active_model:
          type: string
          description: ID of the currently active model

    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [healthy, degraded, unhealthy]
        model_loaded:
          type: boolean
        timescaledb_connected:
          type: boolean
        version:
          type: string

    ErrorResponse:
      type: object
      required: [error, message, timestamp]
      properties:
        error:
          type: string
        message:
          type: string
        timestamp:
          type: string
          format: date-time
        details:
          type: object
          additionalProperties: true
