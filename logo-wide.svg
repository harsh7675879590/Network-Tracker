<svg width="420" height="110" viewBox="0 0 420 110" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark background so the logo renders correctly on all GitHub themes -->
  <rect width="420" height="110" rx="12" fill="#0d1526"/>

  <!-- ===== Icon: simplified orbit / network mark ===== -->
  <g transform="translate(55,55)">
    <ellipse cx="0" cy="0" rx="34" ry="14" fill="none" stroke="#5b7fb5" stroke-width="3.2" transform="rotate(0)"/>
    <ellipse cx="0" cy="0" rx="34" ry="14" fill="none" stroke="#5b7fb5" stroke-width="3.2" transform="rotate(60)"/>
    <ellipse cx="0" cy="0" rx="34" ry="14" fill="none" stroke="#5b7fb5" stroke-width="3.2" transform="rotate(120)"/>
    <circle cx="0" cy="0" r="9" fill="#dfe8f7"/>
    <circle cx="0" cy="0" r="9" fill="none" stroke="#5b7fb5" stroke-width="2"/>
    <circle cx="34" cy="0" r="4.5" fill="#f2a13a"/>
  </g>

  <!-- ===== Wordmark ===== -->
  <text x="112" y="68" font-family="Arial, Helvetica, sans-serif" font-weight="800"
        font-size="40" fill="#eef2f9" letter-spacing="0.5">
    Netbarriers
  </text>
</svg>
